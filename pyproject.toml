[build-system]
requires = ["setuptools>=61", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "goedel"
version = "0.2.0"
description = "Finite symbolic logic, exact Goedel coding and qualified metamathematical catalogues"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "RiskDataScience GmbH"}]
maintainers = [{name = "Dr. Dimitrios Geromichalos", email = "riskdatascience@web.de"}]
keywords = ["logic", "metamathematics", "goedel", "proof-checking"]
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
graph = ["networkx>=3,<4"]
test = ["hypothesis>=6,<7", "pytest>=8,<10", "pytest-cov>=5,<8"]
build = ["build>=1.2,<2", "twine>=6,<8"]
dev = ["build>=1.2,<2", "hypothesis>=6,<7", "pytest>=8,<10", "ruff>=0.11,<1", "twine>=6,<8"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["goedel*"]

[tool.setuptools.package-data]
goedel = ["py.typed", "resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
cache_dir = ".cache/pytest"
addopts = "-q --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["goedel"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 110
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

# Preserve byte-identical, separately reviewed scientific source archives. The
# numerical DSL files are compiled together, so cross-file helpers are deliberate.
[tool.ruff.lint.per-file-ignores]
"tools/reproduction/build.py" = ["E402"]
"tools/reproduction/compile_register.py" = ["I001"]
"tools/reproduction/compile_register_calls.py" = ["I001"]
"tools/reproduction/pa_proof_programs.py" = ["F821"]
"tools/reproduction/pa_specialization.py" = ["F821"]
"tools/reproduction/pa_transformations.py" = ["F821"]
